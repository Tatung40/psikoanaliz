name: Independent R mirt — Lord and Wald DIF
on:
  pull_request:
    branches: [main]
    paths:
      - 'core/dif_lord.py'
      - 'core/dif_lord_rasch.py'
      - 'core/dif_lord_policy.py'
      - 'core/irt_dif.py'
      - 'validation/dif_wald_lord/**'
      - 'validation/lord_rasch_free_scale/**'
      - 'scripts/mirt_irt_b10_reference.R'
      - 'tests/test_dif_wald_lord.py'
      - '.github/workflows/r-mirt-wald-lord.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rasch-free-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify immutable free-SD Rasch evidence or request actual R
        id: rasch
        run: python validation/lord_rasch_free_scale/verify_reference.py
      - uses: r-lib/actions/setup-r@v2
        if: steps.rasch.outputs.needs_r == 'true'
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.rasch.outputs.needs_r == 'true'
        with:
          packages: |
            any::mirt@1.48
            any::jsonlite
            any::digest
            any::numDeriv
          cache-version: 1
      - name: Existing Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted free-SD covariance and policy checks
        run: python -m pytest -q tests/test_lord_rasch_free_scale.py tests/test_lord_1pl_policy.py
      - name: Exactly one Python calibration per group and density
        if: steps.rasch.outputs.needs_r == 'true'
        run: python -m validation.lord_rasch_free_scale.compare --prepare
      - name: Actual independent free-SD R Rasch calibrations
        if: steps.rasch.outputs.needs_r == 'true'
        run: Rscript validation/lord_rasch_free_scale/reference.R > validation/lord_rasch_free_scale/results/R_stdout.log 2> validation/lord_rasch_free_scale/results/R_stderr.log
      - name: Predeclared numerical comparison (no fits)
        run: python -m validation.lord_rasch_free_scale.compare --compare
      - name: Preserve compact original evidence in logs
        if: always()
        run: python -m validation.lord_rasch_free_scale.compare --emit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasch-free-scale-${{ github.sha }}
          path: validation/lord_rasch_free_scale/results/
          if-no-files-found: error
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check exact source/data identity of actual R evidence
        id: reference
        run: python validation/dif_wald_lord/use_reference.py --output validation/dif_wald_lord/results
      - uses: r-lib/actions/setup-r@v2
        if: steps.reference.outputs.needs_r == 'true'
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.reference.outputs.needs_r == 'true'
        with:
          packages: |
            any::mirt@1.48
            any::jsonlite
            any::digest
            any::numDeriv
          cache-version: 1
      - name: Existing Python dependencies
        if: steps.reference.outputs.needs_r == 'true'
        run: python -m pip install -r requirements.txt
      - name: Cached actual Python fits and targeted covariance tests
        if: steps.reference.outputs.needs_r == 'true'
        run: |
          python -m validation.dif_wald_lord.compare --prepare
          python -m pytest -q tests/test_dif_wald_lord.py
      - name: Actual independent R calibrations (three fixtures, no MC)
        if: steps.reference.outputs.needs_r == 'true'
        run: Rscript scripts/mirt_irt_b10_reference.R --wald-lord validation/dif_wald_lord/results > validation/dif_wald_lord/results/R_stdout.log 2> validation/dif_wald_lord/results/R_stderr.log
      - name: Predeclared relative chi-square gate
        if: steps.reference.outputs.needs_r == 'true'
        run: python -m validation.dif_wald_lord.compare --compare
      - name: Verify actual archived reference without new calibration
        if: steps.reference.outputs.needs_r == 'false'
        run: python validation/dif_wald_lord/use_reference.py --verify --output validation/dif_wald_lord/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-mirt-wald-lord-${{ github.sha }}
          path: validation/dif_wald_lord/results/
          if-no-files-found: error
