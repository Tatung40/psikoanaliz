name: 4PL P3 distinguishable-alternative validation
on:
  pull_request:
    paths: ['validation/p3_4pl_closure/**','validation/evidence/p3_4pl_closure/**','tests/test_p3_4pl_closure.py','.github/workflows/p3-4pl-closure.yml']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.cfg.outputs.phase }}
      shards: ${{ steps.cfg.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          python - <<'PY'
          import json,os
          c=json.load(open('validation/p3_4pl_closure/RUN.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('phase='+c['phase']+'\n')
              f.write('shards='+json.dumps(list(range(20 if c['phase']=='confirm' else 4)))+'\n')
          PY
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_p3_4pl_closure.py tests/test_p3_absorption.py tests/test_p3_constrained.py
  calibrations:
    needs: [plan,mathematics]
    if: needs.plan.outputs.phase != 'archive'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: One native fit per new independent dataset; checkpoint every attempt
        run: python -m validation.p3_4pl_closure.runner --phase ${{ needs.plan.outputs.phase }} --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.phase == 'confirm' && 20 || 4 }} --work /tmp/p3n
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p3n-records-${{ matrix.shard }}', path: /tmp/p3n/}
  diagnostic:
    needs: [plan,mathematics]
    if: needs.plan.outputs.phase == 'confirm'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m validation.p3_4pl_closure.witness --out /tmp/p3n-diag/WITNESS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3n-diagnostic, path: /tmp/p3n-diag/}
  aggregate:
    needs: [plan,calibrations]
    if: always() && needs.plan.outputs.phase != 'archive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: 'p3n-records-*', path: /tmp/p3n-records}
      - run: python -m validation.p3_4pl_closure.summary --input /tmp/p3n-records --phase ${{ needs.plan.outputs.phase }} --out /tmp/p3n-report/REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3n-report, path: /tmp/p3n-report/}
