name: 4PL P3 distinguishable-alternative validation
on:
  pull_request:
    paths: ['validation/p3_4pl_closure/**','validation/evidence/p3_4pl_closure/**','tests/test_p3_4pl_closure.py','.github/workflows/p3-4pl-closure.yml']
permissions:
  contents: read
  actions: read
jobs:
  archive-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Existing successful independent audit; NO fits or repeat validation
        uses: actions/download-artifact@v4
        with:
          name: p3n-independent-audit
          path: /tmp/full-audit
          run-id: 45835088987
          github-token: ${{ github.token }}
      - run: python -m validation.p3_4pl_closure.compact --input /tmp/full-audit --out /tmp/p3n-selected
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3n-selected-ledger, path: /tmp/p3n-selected/}
