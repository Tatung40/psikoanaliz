name: Independent R mirt validation
run-name: GRM/PCM no-fit preflight (${{ github.ref_name }})
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grm-pcm-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
      PR63_VALIDATION_COMMIT: 18d1bcf72c85a174ad278ae4d8ea925b412c0275
    steps:
      - uses: actions/checkout@v4
      - name: Initialize failure-preserving diagnostics and verify branch
        run: |
          mkdir -p preflight-output
          printf '%s\n' '{"status":"NOT EXECUTED","R_execution":"NOT EXECUTED","scientific_pass":false,"fits":0,"simulations":0}' > preflight-output/report.json
          touch preflight-output/R_stdout.log preflight-output/R_stderr.log
          test "$GITHUB_REF_NAME" = audit/polytomous-r-strategy
      - name: Verify pinned PR63 helper (fetch only if absent)
        run: |
          if ! git cat-file -e "$PR63_VALIDATION_COMMIT:validation/r_mirt_phase1/harness.py" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PR63_VALIDATION_COMMIT"
          fi
          git cat-file -e "$PR63_VALIDATION_COMMIT:validation/r_mirt_phase1/harness.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::mirt@1.48
          cache-version: 1
      - name: Install only preflight Python dependencies
        run: python -m pip install numpy scipy pandas 'mirt==1.2.0'
      - name: Execute GRM/PCM no-fit preflight ONCE
        run: |
          set -o pipefail
          python validation/poly_r_preflight.py --output preflight-output 2>&1 | tee preflight-output/driver.log
      - name: Require actual R preflight; reject scientific certification
        run: |
          python - <<'PY'
          import json
          r=json.load(open('preflight-output/report.json'))
          assert r['R_execution']=='EXECUTED', r
          assert r['status']=='PREFLIGHT CHECKED / NOT SCIENTIFICALLY VALIDATED', r
          assert r['scientific_pass'] is False and r['fits']==r['simulations']==0, r
          assert str(r['R_metadata']['mirt_version'])=='1.48', r
          assert r['R_checks'] and all(c['checked'] is True for c in r['R_checks']), r
          assert set(r['comparisons'])=={'GRM','PCM'}, r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grm-pcm-no-fit-${{ github.sha }}-${{ github.run_attempt }}
          path: preflight-output/
          if-no-files-found: error
