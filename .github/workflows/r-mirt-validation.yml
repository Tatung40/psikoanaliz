name: Independent R mirt validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::mirt
          cache-version: 1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt 'mirt==1.2.0'
      - name: Targeted harness tests
        run: python -m pytest -q tests/test_r_mirt_phase1.py
      - name: Execute each binary model once (independent ML)
        run: |
          mkdir -p validation-output
          set -o pipefail
          python validation/r_mirt_phase1/harness.py --output validation-output --models Rasch 1PL 2PL 3PL 4PL --estimation ML 2>&1 | tee validation-output/execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-r-mirt-${{ github.sha }}
          path: validation-output/
          if-no-files-found: error
      - name: Require actual execution (not scientific certification)
        run: |
          python - <<'PY'
          import json
          r = json.load(open('validation-output/report.json'))
          assert len(r['models']) == 5
          assert all(m['execution'] == 'EXECUTED' and 'comparisons' in m for m in r['models']), r
          assert all(m['status'] != 'FAIL' for m in r['models']), r
          PY
