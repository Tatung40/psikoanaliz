name: Independent R mirt validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::mirt
          cache-version: 1
      - name: R mirt runtime preflight only (no fits)
        run: |
          mkdir -p validation-output
          status=0
          Rscript validation/r_mirt_phase1/runtime_preflight.R validation-output >validation-output/stdout.log 2>validation-output/stderr.log || status=$?
          cat validation-output/stdout.log
          cat validation-output/stderr.log >&2
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-r-mirt-${{ github.sha }}
          path: validation-output/
          if-no-files-found: error
