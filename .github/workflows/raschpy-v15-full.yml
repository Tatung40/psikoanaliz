name: RaschPy V15 full simulation
on:
  push:
    paths:
      - '.github/workflows/raschpy-v15-full.yml'
  workflow_dispatch:
jobs:
  v15:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install simulation dependencies
        run: python -m pip install 'raschpy==1.4.0' 'numpy>=1.24' 'pandas>=2' 'scipy>=1.11' 'matplotlib>=3.8' 'openpyxl>=3.1.2' 'python-docx>=1.1'
      - name: Run V15 full preregistered protocol (60 null + 30 power)
        run: |
          set -o pipefail
          PYTHONPATH=. python -m validation.raschpy_mfrm.simulation_v15 --null 60 --power 30 --workers 2 2>&1 | tee v15-run.log
        env:
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raschpy-v15-full-evidence
          path: |
            validation/raschpy_mfrm/simulation_v15.json
            validation/raschpy_mfrm/simulation_v15_checkpoint.jsonl
            v15-run.log
          if-no-files-found: warn
