name: PsikoAnaliz tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py core ui tests
      - name: Optional Python mirt 1.2.0 install/import smoke (pull requests)
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: 'mirt==1.2.0'
          python -c "import importlib.metadata, mirt; assert importlib.metadata.version('mirt') == '1.2.0'; assert callable(mirt.fit_mirt); print('PYTHON MIRT IMPORT OK - SCIENTIFIC FIT NOT YET VALIDATED')"
      - name: Targeted regression tests (pull requests)
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: python -m pytest -vv -s tests/test_irt_b11_regression_gates.py tests/test_irt_b12_audit.py tests/test_irt_b12_compare.py tests/test_irt_b12_3_mixed.py tests/test_irt_b12_reference.py tests/test_irt_mixed_se.py tests/test_irt_engine_registry.py tests/test_irt_python_mirt_adapter.py tests/test_irt_python_mirt_3pl_4pl.py tests/test_irt_binary_unified.py tests/test_irt_binary_navigation.py tests/test_irt_python_mirt_ui.py tests/test_irt_b13_curves.py tests/test_irt_b13_integration.py tests/test_irt_b13_png.py
      - name: Full regression suite (main)
        if: github.event_name == 'push'
        timeout-minutes: 55
        run: python -m pytest -q
