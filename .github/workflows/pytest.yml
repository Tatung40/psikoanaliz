name: PsikoAnaliz tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py core ui tests
      - name: Python mirt 1.2.0 install/import verification
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: 'mirt==1.2.0'
          python -c "import importlib.metadata, mirt; assert importlib.metadata.version('mirt') == '1.2.0'; assert callable(mirt.fit_mirt); print('PYTHON MIRT IMPORT OK - SCIENTIFIC FIT NOT YET VALIDATED')"
      - name: Regression tests (pull requests; full integration suite)
        if: github.event_name == 'pull_request'
        timeout-minutes: ${{ (github.head_ref == 'integration/73-75-main' || github.head_ref == 'feat/reproducible-python-r-code') && 55 || 15 }}
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: |
          if [ "$GITHUB_HEAD_REF" = integration/73-75-main ] || [ "$GITHUB_HEAD_REF" = feat/reproducible-python-r-code ]; then
            python -m pytest -q
          else
            python -m pytest -q tests/test_irt_b11_regression_gates.py tests/test_irt_b12_audit.py tests/test_irt_b12_compare.py tests/test_irt_b12_3_mixed.py tests/test_irt_b12_reference.py tests/test_irt_mixed_se.py tests/test_irt_engine_registry.py tests/test_irt_python_mirt_adapter.py tests/test_irt_python_mirt_3pl_4pl.py tests/test_irt_binary_unified.py tests/test_irt_binary_navigation.py tests/test_irt_python_mirt_ui.py tests/test_irt_b13_curves.py tests/test_irt_b13_integration.py tests/test_irt_b13_png.py tests/test_irt_b13_comparison.py tests/test_irt_b13_diagnostics.py tests/test_irt_b14.py tests/test_irt_b14_reporting.py tests/test_irt_assumptions.py tests/test_irt_b14_profiles.py tests/test_irt_b14_narrative.py tests/test_irt_b14_audit.py tests/test_irt_b14_model_curves.py tests/test_irt_b14_diagnostics.py tests/test_irt_dif_multimodel_screen.py tests/test_dual_engine_sidebar.py tests/test_python_mirt_nine_results.py tests/test_pre_real_data_python_engine.py tests/test_python_engine_stale_controls.py tests/test_irt_b11_streamlit.py::test_apptest_3pl_library_route_and_isolation tests/test_irt_streamlit_apptest.py::test_3pl_library_controls_and_report_toggles_do_not_refit tests/test_irt_rsm.py tests/test_dif_classical.py tests/test_dif_classical_view.py tests/test_rsm_dif_pages.py tests/test_irt_binary_usage_policy.py tests/test_irt_b14_persons_info.py tests/test_legacy_reachability.py tests/test_irt_streamlit_smoke.py tests/test_dif34_bootstrap.py tests/test_dif34_bootstrap_view.py tests/test_mtk_evidence.py tests/test_nrm_se_fix.py tests/test_phase2_solver.py tests/test_phase2_wright.py tests/test_phase2_nine_models.py tests/test_phase2_browser_data.py tests/test_integration_73_75.py tests/test_python_mirt_solver_controls.py tests/test_likert_category_origin.py tests/test_python_mirt_dif.py tests/test_dimensionality_localfit.py tests/test_dimensionality_localfit_streamlit.py tests/test_irt_itemfit.py tests/test_reproducible.py tests/test_generalizability.py tests/test_generalizability_ui.py
          fi
      - name: Real public LSAT6 KTK benchmark (independent Pingouin)
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python -m scripts.real_lsat6_ctt_pilot
      - name: Select relevant formal DIF gates
        id: dif_paths
        if: github.event_name == 'pull_request'
        run: python scripts/dif_ci_paths.py
      - name: GRM numerical, independent-reference, report and UI gates
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.grm == 'true'
        timeout-minutes: 10
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_grm_dif.py tests/test_grm_report_ui.py tests/test_grm_study.py tests/test_grm_ci_routes.py
      - name: PCM GPCM RSM NRM scientific and research bundle gates
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.polytomous == 'true'
        timeout-minutes: 10
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_polytomous_dif.py tests/test_polytomous_reports_ui.py tests/test_polytomous_study.py tests/test_polytomous_ci.py
      - name: Formal DIF numerical and reference gates (pull requests)
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.binary == 'true'
        timeout-minutes: 15
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_dif_likelihood_validity.py tests/test_dif34_safeguards.py tests/test_dif_fixed_anchors.py tests/test_dif_fixed_anchor_simulation.py tests/test_dif_fixed_anchor_exports.py tests/test_irt_b10.py tests/test_irt_b10_streamlit.py tests/test_irt_b11.py
      - name: Full regression suite (main)
        if: github.event_name == 'push'
        timeout-minutes: 55
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q

  reproducible-native-r:
    name: Native R reproducible code (no model fits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Use primary Ubuntu archive for R system packages
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Lightweight existing codec/test dependencies
        run: python -m pip install 'numpy>=1.24.0' 'pandas>=2.0.0' 'pytest>=8.0.0' 'generalizit==0.1.2'
      - name: Actual native R parse, execution and descriptive comparison
        env:
          REQUIRE_REPRO_R: '1'
        run: python -m pytest -q tests/test_reproducible.py::test_r_real_execution_and_basic_result_comparison --basetemp=repro-r-diagnostics
      - name: Independent R ANOVA reference for crossed and nested G/D studies
        env:
          REQUIRE_GTHEORY_R: '1'
        run: python -m pytest -q tests/test_generalizability.py::test_independent_r_anova_and_g_d --basetemp=gtheory-r-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducible-native-r-${{ github.sha }}
          path: |
            repro-r-diagnostics/
            gtheory-r-diagnostics/
