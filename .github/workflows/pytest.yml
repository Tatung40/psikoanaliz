name: PsikoAnaliz tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py core ui tests
      - name: Python mirt 1.2.0 install/import verification
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: 'mirt==1.2.0'
          python -c "import importlib.metadata, mirt; assert importlib.metadata.version('mirt') == '1.2.0'; assert callable(mirt.fit_mirt); print('PYTHON MIRT IMPORT OK - SCIENTIFIC FIT NOT YET VALIDATED')"
      # Opt in once per PR using <!-- full-regression --> in its body.
      - name: Regression tests (pull requests; full integration suite)
        if: github.event_name == 'pull_request'
        timeout-minutes: ${{ (github.head_ref == 'integration/73-75-main' || github.head_ref == 'feat/reproducible-python-r-code' || contains(github.event.pull_request.body, '<!-- full-regression -->')) && 55 || 30 }}
        env:
          FULL_REGRESSION: ${{ contains(github.event.pull_request.body, '<!-- full-regression -->') }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: |
          if [ "$FULL_REGRESSION" = true ] || [ "$GITHUB_HEAD_REF" = integration/73-75-main ] || [ "$GITHUB_HEAD_REF" = feat/reproducible-python-r-code ]; then
            python -m pytest -q -rs
          else
            python -m pytest -q tests/test_irt_b11_regression_gates.py tests/test_irt_python_mirt_adapter.py tests/test_irt_python_mirt_3pl_4pl.py tests/test_irt_binary_navigation.py tests/test_irt_python_mirt_ui.py tests/test_irt_b14.py tests/test_irt_b14_reporting.py tests/test_irt_assumptions.py tests/test_irt_b14_profiles.py tests/test_irt_b14_narrative.py tests/test_irt_b14_audit.py tests/test_irt_b14_model_curves.py tests/test_irt_b14_diagnostics.py tests/test_irt_completion_safety.py tests/test_irt_model_comparison.py tests/test_scientific_gap_closure.py tests/test_certification_q123.py tests/test_irt_dif_multimodel_screen.py tests/test_dual_engine_sidebar.py tests/test_python_mirt_nine_results.py tests/test_pre_real_data_python_engine.py tests/test_python_engine_stale_controls.py tests/test_irt_b11_streamlit.py::test_apptest_3pl_library_route_and_isolation tests/test_irt_streamlit_apptest.py::test_3pl_library_controls_and_report_toggles_do_not_refit tests/test_irt_rsm.py tests/test_dif_classical.py tests/test_dif_classical_view.py tests/test_rsm_dif_pages.py tests/test_irt_binary_usage_policy.py tests/test_irt_b14_persons_info.py tests/test_python_mirt_fixed_se.py tests/test_golden_master_python.py tests/test_irt_comparison_page.py tests/test_irt_binary_extras.py tests/test_bifactor_examples.py 'tests/test_mirt_factorized.py::test_actual_factorized_ui_scores_exports_and_stale_asymptote[4PL]' tests/test_mirt_general_ui.py::test_actual_general_fit_id_posterior_exports_and_stale_inputs tests/test_native_library_equivalence.py tests/test_mirt_boundary_warning.py tests/test_b14_optional_exports.py tests/test_coverage_precision.py tests/test_binary_se_coverage_evidence.py tests/test_binary34_se_coverage_evidence.py tests/test_irt_binary_multistart.py tests/test_r_mirt_34.py tests/test_bifactor_recovery_evidence.py tests/test_r_mirt_polytomous.py tests/test_rasch_b9_streamlit.py tests/test_legacy_reachability.py tests/test_irt_streamlit_smoke.py tests/test_dif34_bootstrap.py tests/test_dif34_bootstrap_view.py tests/test_mtk_evidence.py tests/test_dif_precision_reuse.py tests/test_ordinal_dif_paired.py tests/test_ordinal_dif_control.py tests/test_ordinal_dif_analytic.py tests/test_ordinal_dif_total_rest.py tests/test_ordinal_dif_impact_zero.py tests/test_ordinal_dif_grm_lr_paired.py tests/test_grm_lr_full_mc.py tests/test_gh81_diagnostic.py tests/test_gh_reoptimization.py tests/test_grm_gh101_uniform_pilot.py tests/test_grm_fwer_sequential.py tests/test_grm_fwer_archive.py tests/test_grm_fwer_sequential_evidence.py tests/test_nrm_se_fix.py tests/test_phase2_solver.py tests/test_phase2_wright.py tests/test_phase2_nine_models.py tests/test_phase2_browser_data.py tests/test_integration_73_75.py tests/test_python_mirt_solver_controls.py tests/test_likert_category_origin.py tests/test_python_mirt_dif.py tests/test_dif_center.py tests/test_dif_center_ui.py tests/test_dif_wald_lord.py tests/test_dif_wald_lord_evidence.py tests/test_lord_1pl_policy.py tests/test_archived_source_identity.py tests/test_dimensionality_localfit.py tests/test_dimensionality_localfit_streamlit.py tests/test_irt_itemfit.py tests/test_startup_imports.py tests/test_python_mirt_2pl_word_live_flow.py tests/test_reproducible.py tests/test_reproducible_result_fields.py tests/test_reproducible_page_reruns.py tests/test_generalizability.py tests/test_generalizability_ui.py tests/test_example_datasets.py tests/test_example_datasets_ui.py tests/test_universal_academic_capture.py tests/test_universal_academic_word.py tests/test_academic_screen_results.py tests/test_word_standard.py tests/test_result_panels.py
          fi
      - name: Golden-master equivalence vs pre-removal main (same runner, exact)
        # Python-library outputs must be identical to main before the native engine removal
        # (fa2e25e). Update GOLDEN_REFERENCE only for an intended, reviewed output change.
        timeout-minutes: 20
        env:
          GOLDEN_REFERENCE: fa2e25ec32f064a1220b5bd5773cfeb0eb6c1126
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
          PYTHONPATH: .
        run: |
          git fetch --no-tags --depth=1 origin "$GOLDEN_REFERENCE"
          git worktree add --detach /tmp/golden-reference FETCH_HEAD
          python tools/golden_master.py capture /tmp/golden-reference.json.gz --root /tmp/golden-reference
          python tools/golden_master.py capture /tmp/golden-current.json.gz
          # Intended: bifactor teaching data regenerated with 3 specific groups (screen requires 3–4);
          # Rater reliability module: three new teaching datasets (rater_117–119) in the shared example library.
          # G Theory (PR gtheory-final): library run on centered, power-of-ten scaled scores, so components are no longer
          # 4-dp rounded and SEM/error-budget tables are added (validation/generalizability/PROTOCOL_FINAL.json).
          # B14 "Bilimsel durum" text now states the R mirt / Monte Carlo evidence (PR #97; no numerical change).
          python tools/golden_master.py compare /tmp/golden-reference.json.gz /tmp/golden-current.json.gz \
            --intended /example_library/mirt_051 --intended /example_library/mirt_052 --intended /example_library/mirt_053 \
            --intended '/b14/GRM/tables/Meta/rows[1][1]:' --intended '/b14/PCM/tables/Meta/rows[1][1]:' \
            --intended '/b14/GPCM/tables/Meta/rows[1][1]:' --intended '/b14/NRM/tables/Meta/rows[1][1]:' \
            --intended '/python_mirt_models/1PL/metadata/Kullanım durumu:' \
            --intended '/python_mirt_models/2PL/metadata/Kullanım durumu:' \
            --intended '/python_mirt_models/1PL/usage_labels' --intended '/python_mirt_models/2PL/usage_labels' \
            --intended '/python_mirt_models/1PL/warnings[1]:' \
            --intended '/python_dif/2PL/tables/Raju_area:' \
            --intended /generalizability \
            --intended /example_library/rater_117 --intended /example_library/rater_118 --intended /example_library/rater_119
      - name: Real public LSAT6 KTK benchmark (independent Pingouin)
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python -m scripts.real_lsat6_ctt_pilot
      - name: Select relevant formal DIF gates
        id: dif_paths
        if: github.event_name == 'pull_request'
        run: python scripts/dif_ci_paths.py
      - name: GRM numerical, independent-reference, report and UI gates
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.grm == 'true'
        timeout-minutes: 10
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_grm_dif.py tests/test_grm_report_ui.py tests/test_grm_study.py tests/test_grm_ci_routes.py
      - name: PCM GPCM RSM NRM scientific and research bundle gates
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.polytomous == 'true'
        timeout-minutes: 10
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_polytomous_dif.py tests/test_polytomous_reports_ui.py tests/test_polytomous_study.py tests/test_polytomous_ci.py
      - name: Formal DIF numerical and reference gates (pull requests)
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.binary == 'true'
        timeout-minutes: 15
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_dif_likelihood_validity.py tests/test_dif_fixed_anchors.py tests/test_dif_fixed_anchor_simulation.py tests/test_irt_b10.py tests/test_irt_b11.py
      - name: Full regression suite (main)
        if: github.event_name == 'push'
        timeout-minutes: 55
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q
  reproducible-native-r:
    name: Native R reproducible code (no model fits)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Use primary Ubuntu archive for R system packages
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Lightweight existing codec/test dependencies
        run: python -m pip install 'numpy>=1.24.0' 'pandas>=2.0.0' 'pytest>=8.0.0' 'generalizit==0.1.2'
      - name: Actual native R parse, execution and descriptive comparison
        env:
          REQUIRE_REPRO_R: '1'
        run: python -m pytest -q tests/test_reproducible.py::test_r_real_execution_and_basic_result_comparison --basetemp=repro-r-diagnostics
      - name: Independent R ANOVA reference for crossed and nested G/D studies
        env:
          REQUIRE_GTHEORY_R: '1'
        run: |
          git clone -q https://github.com/cran/gtheoryr /tmp/gtheoryr && git -C /tmp/gtheoryr checkout -q 3b53991557bfe2046119d37bf028a4647faedc18
          GTHEORYR_SRC=/tmp/gtheoryr python -m pytest -q tests/test_generalizability.py::test_independent_r_anova_and_g_d tests/test_generalizability.py::test_independent_gtheoryr_crossed --basetemp=gtheory-r-diagnostics
      - name: Independent R references for the 30 inter-rater methods (irr, irrCAC, psych, stats)
        env:
          REQUIRE_RATER_R: '1'
        run: |
          python -m pip install 'scipy>=1.11' 'statsmodels>=0.14.0' 'pingouin>=0.5.5,<0.7' 'krippendorff>=0.8,<1.0' 'openpyxl>=3.1'
          Rscript -e 'install.packages(c("dplyr", "magrittr", "psych"))'
          git clone -q https://github.com/cran/irr /tmp/irr && git -C /tmp/irr checkout -q 98e4535cece091e099e7ad7ad96fb132a53fc2d8
          git clone -q https://github.com/cran/irrCAC /tmp/irrCAC && git -C /tmp/irrCAC checkout -q 720ab226e407e238bf85f86e9458b93e7793e8a3
          IRR_SRC=/tmp/irr IRRCAC_SRC=/tmp/irrCAC python -m pytest -q tests/test_rater_reliability.py::test_independent_r_references --basetemp=rater-r-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducible-native-r-${{ github.sha }}
          path: |
            repro-r-diagnostics/
            gtheory-r-diagnostics/
            rater-r-diagnostics/
