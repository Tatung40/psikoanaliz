name: PsikoAnaliz tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py core ui tests
      - name: Python mirt 1.2.0 install/import verification
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: 'mirt==1.2.0'
          python -c "import importlib.metadata, mirt; assert importlib.metadata.version('mirt') == '1.2.0'; assert callable(mirt.fit_mirt); print('PYTHON MIRT IMPORT OK - SCIENTIFIC FIT NOT YET VALIDATED')"
      - name: Targeted regression tests (pull requests)
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: python -m pytest -vv -s tests/test_irt_b11_regression_gates.py tests/test_irt_b12_audit.py tests/test_irt_b12_compare.py tests/test_irt_b12_3_mixed.py tests/test_irt_b12_reference.py tests/test_irt_mixed_se.py tests/test_irt_engine_registry.py tests/test_irt_python_mirt_adapter.py tests/test_irt_python_mirt_3pl_4pl.py tests/test_irt_binary_unified.py tests/test_irt_binary_navigation.py tests/test_irt_python_mirt_ui.py tests/test_irt_b13_curves.py tests/test_irt_b13_integration.py tests/test_irt_b13_png.py tests/test_irt_b13_comparison.py tests/test_irt_b13_diagnostics.py tests/test_irt_b14.py tests/test_irt_b14_reporting.py tests/test_irt_assumptions.py tests/test_irt_b14_profiles.py tests/test_irt_b14_narrative.py tests/test_irt_b14_audit.py tests/test_irt_b14_model_curves.py tests/test_irt_b14_diagnostics.py tests/test_ctt_dual_engine.py tests/test_ctt_item_crosscheck.py tests/test_ctt_release_bundle.py tests/test_irt_dif_multimodel_screen.py
      - name: Select relevant formal DIF gates
        id: dif_paths
        if: github.event_name == 'pull_request'
        run: python scripts/dif_ci_paths.py
      - name: GRM numerical, independent-reference, report and UI gates
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.grm == 'true'
        timeout-minutes: 10
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_grm_dif.py tests/test_grm_report_ui.py tests/test_grm_study.py tests/test_grm_ci_routes.py
      - name: Formal DIF numerical and reference gates (pull requests)
        if: github.event_name == 'pull_request' && steps.dif_paths.outputs.binary == 'true'
        timeout-minutes: 15
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_dif_likelihood_validity.py tests/test_dif_fixed_anchors.py tests/test_dif_fixed_anchor_simulation.py tests/test_dif_fixed_anchor_exports.py tests/test_irt_b10.py tests/test_irt_b10_streamlit.py tests/test_irt_b11.py
      - name: Full regression suite (main)
        if: github.event_name == 'push'
        timeout-minutes: 55
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: python -m pytest -q
