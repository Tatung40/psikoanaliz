name: CTT R reference comparison
on:
  pull_request:
    paths: ['validation/ctt_reference/**', 'core/reliability.py', 'core/reliability_extended.py', '.github/workflows/ctt-reference.yml']
permissions: {contents: read}
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: release, use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: {packages: "any::psych\nany::lavaan\nany::jsonlite", cache-version: 1}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p out
          python validation/ctt_reference/python_values.py out
          Rscript validation/ctt_reference/r_values.R out
          python validation/ctt_reference/compare.py out
      - uses: actions/upload-artifact@v4
        with: {name: ctt-reference, path: out/}
