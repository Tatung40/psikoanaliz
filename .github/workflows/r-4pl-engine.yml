name: 4PL engine selection (R mirt actual fits)
on:
  pull_request:
    branches: [main]
    paths: ['validation/four_pl_engine/**', '.github/workflows/r-4pl-engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: '4.6.1', use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt@1.48
            any::jsonlite
            any::TAM
            any::ltm
          cache-version: 1
      - run: python -m pip install -r requirements.txt
      - run: python validation/four_pl_engine/compare.py --output validation-output/four-pl-engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-pl-engine-${{ github.sha }}
          path: validation-output/
          if-no-files-found: error
