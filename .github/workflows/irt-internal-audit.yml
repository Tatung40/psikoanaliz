name: IRT 3PL 4PL internal scientific audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/irt_internal_audit.py'
      - '.github/workflows/irt-internal-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install open scientific dependencies
        run: python -m pip install numpy pandas scipy xlsxwriter
      - name: Run 3PL and 4PL internal audit
        run: python scripts/irt_internal_audit.py
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irt-3pl4pl-internal-audit
          path: artifacts/irt-internal-audit/
          if-no-files-found: warn
          retention-days: 14
