name: IRT multistart empirical check
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/irt_multistart_check.py'
      - '.github/workflows/irt-multistart-check.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install open scientific dependencies
        run: python -m pip install numpy pandas scipy xlsxwriter
      - name: Compare initialization strategies
        run: python scripts/irt_multistart_check.py --sample-sizes 200,500 --repetitions 2 --max-iter 70
      - name: Upload empirical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irt-multistart-check
          path: artifacts/irt-starts/
          retention-days: 14
          if-no-files-found: warn
