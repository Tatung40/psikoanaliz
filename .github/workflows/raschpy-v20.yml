name: RaschPy V20 matrix confirmatory
# Re-runs the preregistered V19 protocol in 4 parallel shards (design x scenario) and requires each shard to reproduce
# the committed evidence (validation/raschpy_mfrm/matrix_v20.json): same gate outcomes, numbers within 1e-6.
on:
  pull_request:
    paths: ['validation/raschpy_mfrm/matrix_v20.*', 'validation/raschpy_mfrm/PROTOCOL.json', 'examples/mfrm/build.py', 'requirements.txt']
  workflow_dispatch:
jobs:
  v20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        design: [balanced, linked]
        scenario: ['null', 'nonzero']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -q raschpy==1.4.0 pandas numpy scipy
      - name: Reproduce V20 shard
        run: |
          PYTHONPATH=. python -m validation.raschpy_mfrm.matrix_v20 --reps 5000 --workers 4 --design ${{ matrix.design }} --scenario ${{ matrix.scenario }} --out /tmp/shard.json
          python - <<'PY'
          import json, math
          a = json.load(open('validation/raschpy_mfrm/matrix_v20.json'))['results']; b = json.load(open('/tmp/shard.json'))['results']
          d, s = '${{ matrix.design }}', '${{ matrix.scenario }}'; bad = []
          def walk(x, y, path):
              if isinstance(x, dict):
                  for k in x: walk(x[k], (y or {}).get(k), f"{path}/{k}")
              elif isinstance(x, list):
                  for i, (p, q) in enumerate(zip(x, y or [])): walk(p, q, f"{path}[{i}]")
              elif isinstance(x, float):
                  if y is None or not math.isclose(x, y, abs_tol=1e-6): bad.append((path, x, y))
              elif x != y: bad.append((path, x, y))
          walk(a[s][d], b[s][d], f"{s}/{d}")
          print('differences:', len(bad), bad[:10]); assert not bad
          PY
