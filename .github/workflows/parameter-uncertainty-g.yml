name: MAP parameter centered-score covariance confirmation
on:
  pull_request:
    paths:
      - 'validation/parameter_uncertainty_g/**'
      - 'tests/test_parameter_uncertainty_g.py'
      - '.github/workflows/parameter-uncertainty-g.yml'
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        model: ['3PL','4PL']
        n: [3000,10000]
        j: [12,30]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exact score and joint-covariance tests before execution
        run: python -m pytest -q tests/test_parameter_uncertainty_g.py
      - name: One preregistered confirmation cell; preserve failures
        run: |
          mkdir -p /tmp/parameter-se
          set -o pipefail
          if [ -f 'validation/evidence/parameter_uncertainty_g/${{ matrix.model }}_${{ matrix.n }}_${{ matrix.j }}.json' ]; then
            python -m pytest -q 'tests/test_parameter_uncertainty_g_evidence.py::test_archived_confirmation[${{ matrix.model }}-${{ matrix.n }}-${{ matrix.j }}]'
            git fetch --no-tags --depth=1 origin 2211429dc7c8226f11f95a9305bb93ac57b0abd8
            for source in validation/parameter_uncertainty_g/runner.py validation/parameter_uncertainty_g/PROTOCOL.json core/irt_binary_inference.py core/irt_python_mirt_adapter.py validation/binary_certification/common.py validation/irt_3pl4pl_root_cause.py validation/coverage_precision.py; do
              git show '2211429dc7c8226f11f95a9305bb93ac57b0abd8':"$source" | cmp - "$source"
            done
            echo 'REUSED canonical confirmation 45606844841; exact scientific sources; no new fit; NOT CERTIFIED.'
          else
            python -u validation/parameter_uncertainty_g/runner.py --model '${{ matrix.model }}' --n '${{ matrix.n }}' --j '${{ matrix.j }}' --output /tmp/parameter-se 2>&1 | tee /tmp/parameter-se/execution.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameter-se-${{ matrix.model }}-${{ matrix.n }}-${{ matrix.j }}
          path: /tmp/parameter-se/
