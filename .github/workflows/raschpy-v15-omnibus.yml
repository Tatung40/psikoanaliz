name: RaschPy V15 omnibus null calibration
on:
  push:
    branches: [validation/v15-omnibus-null-calibration]
    paths:
      - '.github/workflows/raschpy-v15-omnibus.yml'
      - 'validation/raschpy_mfrm/v15_omnibus_null_calibration.py'
  workflow_dispatch:
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install 'raschpy==1.4.0' 'numpy>=1.24' 'pandas>=2' 'scipy>=1.11' 'matplotlib>=3.8' 'openpyxl>=3.1.2' 'python-docx>=1.1'
      - name: Independent 120-replication null calibration
        run: |
          set -o pipefail
          PYTHONPATH=. python -m validation.raschpy_mfrm.v15_omnibus_null_calibration 2>&1 | tee v15-omnibus.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-omnibus-calibration
          path: |
            validation/raschpy_mfrm/v15_omnibus_null_calibration.json
            v15-omnibus.log
