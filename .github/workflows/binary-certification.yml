name: Binary IRT certification — R mirt equivalence (G1)
on:
  pull_request:
    paths:
      - 'validation/binary_certification/**'
      - 'validation/evidence/binary_certification/**'
      - 'core/irt_binary_inference.py'
      - 'core/irt_python_mirt_adapter.py'
      - 'core/irt_binary_usage_policy.py'
      - '.github/workflows/binary-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt@1.48
            any::jsonlite
            any::numDeriv
          cache-version: 3
      - name: Install Python scientific dependencies
        run: python -m pip install -r requirements.txt 'mirt==1.2.0'
      - name: Fixtures and Python mirt fits
        run: python validation/binary_certification/r_equivalence.py prepare --out g1
      - name: R mirt 1.48 reference fits
        timeout-minutes: 18
        run: |
          python -c "import json;m=json.load(open('g1/manifest.json'));m.sort(key=lambda c:-c['shape'][0]*c['shape'][1]*(3 if c['model'] in ('3PL','4PL') else 1));[json.dump([c],open(f'g1/one_{i:02d}.json','w')) for i,c in enumerate(m)]"
          ls g1/one_*.json | xargs -P 4 -I{} sh -c 'timeout 600 Rscript validation/binary_certification/reference.R {} g1 > {}.log 2>&1 || echo "{} R process ended with status $?" >> {}.log'
          cat g1/one_*.json.log
      - name: Independent arbiter comparison
        if: always()
        run: |
          python validation/binary_certification/r_equivalence.py compare --out g1 --evidence g1/r_equivalence.json
          echo "=====G1-EVIDENCE-BEGIN====="; base64 -w0 g1/r_equivalence.json; echo; echo "=====G1-EVIDENCE-END====="
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-certification-g1-${{ github.sha }}
          path: g1/
          retention-days: 30
      - name: Recomputed G1 equals the committed evidence and the certification decision
        run: python validation/binary_certification/certify.py --check-g1 g1/r_equivalence.json
  c1-4pl:
    # Evidence committed (validation/evidence/binary_certification/c1_4pl.json); re-run on demand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fixture: ['fresh_3000_30_405', 'fresh_10000_12_406', 'fresh_10000_30_407']
        start: ['default', 'nested']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .
      R_START: ${{ matrix.start }}
      R_BUDGET: '900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt@1.48
            any::jsonlite
            any::numDeriv
          cache-version: 3
      - name: Install Python scientific dependencies
        run: python -m pip install -r requirements.txt 'mirt==1.2.0'
      - name: Fixture, Python mirt fit and independent numpy reference
        run: python validation/binary_certification/b2_4pl.py prepare --out c1 --only ${{ matrix.fixture }}
      - name: R mirt start (900 s budget, amendment C1), R log-posterior evaluation, matched initialization
        timeout-minutes: 19
        run: |
          Rscript validation/binary_certification/reference.R c1/manifest.json c1 || true
          Rscript validation/binary_certification/b2_checks.R c1/manifest.json c1 || true
      - name: Job evidence
        if: always()
        run: |
          python validation/binary_certification/c1_combine.py --out c1 --start ${{ matrix.start }} --evidence c1/job.json
          echo "=====C1-EVIDENCE-BEGIN====="; base64 -w0 c1/job.json; echo; echo "=====C1-EVIDENCE-END====="
