name: Binary global fit validation
on:
  pull_request:
    paths: ['validation/binary_global_fit/**','validation/evidence/binary_global_fit/**','tests/test_binary_global_fit*.py','core/irt_global_fit.py','core/irt_python_mirt_report.py','ui/irt_python_library_view.py','reports/irt_binary_report.py','.github/workflows/binary-global-fit.yml']
permissions: {contents: read, actions: read}
jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: .,OPENBLAS_NUM_THREADS: '1',OMP_NUM_THREADS: '1',MKL_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Frozen independent confirmation sources; no new scientific fits
        run: |
          python - <<'PY'
          import subprocess,pathlib
          source="1d166c5310c34136df51f8e58fb09630206512e9"
          for path in ("validation/binary_global_fit/kernel.py","validation/binary_global_fit/analysis.py","validation/binary_global_fit/dgp.py","validation/binary_global_fit/runner.py","validation/binary_global_fit/statistics.py","validation/binary_global_fit/PROTOCOL.json","validation/binary_global_fit/SELECTION.json","validation/p3_empirical/kernel.py","validation/p3_empirical/constrained.py","validation/p3_sx2_analytic/kernel.py"):
              assert subprocess.check_output(["git","show",source+":"+path])==pathlib.Path(path).read_bytes(),path
          print("Frozen confirmation estimand/sources verified; numerical campaign NOT rerun")
          PY
      - name: Affected mathematical, refusal, cache and export contracts
        run: python -m pytest -q tests/test_binary_global_fit.py tests/test_binary_global_fit_production.py
      - name: Real 3PL/4PL user-flow regressions (software fixtures only)
        run: python -m pytest -q 'tests/test_python_mirt_nine_results.py::test_actual_streamlit_tables_plots_downloads_and_invalidation[3PL]' 'tests/test_python_mirt_nine_results.py::test_actual_streamlit_tables_plots_downloads_and_invalidation[4PL]'
      - name: Static reproducibility inventory
        run: |
          python tools/inventory_reproducible.py
          git diff --exit-code -- validation/REPRODUCIBLE_ANALYSIS_INVENTORY.json
      - name: Archived independent evidence audit; no missing-cache refits
        run: |
          if [ -f validation/evidence/binary_global_fit/CONFIRMATION.jsonl.gz ]; then
            python -m validation.binary_global_fit.audit
          else
            echo "Confirmation still running on frozen source head; all new production inference gates fail closed"
          fi
  parameter-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {PYTHONPATH: .,OPENBLAS_NUM_THREADS: '1',OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: 'global-confirm-*'
          run-id: 45856527113
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/global-frozen
      - name: Materialize existing exact coefficient arrays only; NO fits
        run: python -m validation.binary_global_fit.archive_parameters --input /tmp/global-frozen --out /tmp/global-parameters
      - uses: actions/upload-artifact@v4
        with: {name: global-parameter-arrays,path: /tmp/global-parameters/}
  transport-parameters:
    needs: parameter-archive
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {model: [3PL,4PL]}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: global-parameter-arrays,path: /tmp/global-parameters}
      - name: Preserve exact binary archive for repository transport; no numerical computation
        env: {MODEL: '${{ matrix.model }}'}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib
          model=os.environ["MODEL"];b=pathlib.Path("/tmp/global-parameters/COEFFICIENTS_"+model+".npz").read_bytes()
          print("PARAMETER_INFO "+json.dumps(dict(model=model,size=len(b),git_blob=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest(),sha256=hashlib.sha256(b).hexdigest())))
          print("PARAMETER_BASE64 "+base64.b64encode(b).decode())
          PY
