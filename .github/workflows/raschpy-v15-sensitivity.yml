name: RaschPy V15 targeted DGP sensitivity
on:
  push:
    branches: [validation/v15-omnibus-null-calibration]
    paths:
      - 'validation/raschpy_mfrm/v15_omnibus_sensitivity.py'
      - '.github/workflows/raschpy-v15-sensitivity.yml'
  workflow_dispatch:
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install 'raschpy==1.4.0' 'numpy>=1.24' 'pandas>=2' 'scipy>=1.11' 'matplotlib>=3.8' 'openpyxl>=3.1.2' 'python-docx>=1.1'
      - name: Two null DGPs (N=250 and N=750, 40 each)
        run: PYTHONPATH=. python -m validation.raschpy_mfrm.v15_omnibus_sensitivity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-dgp-sensitivity
          path: validation/raschpy_mfrm/v15_omnibus_sensitivity.json
