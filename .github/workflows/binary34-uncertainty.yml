name: 3PL 4PL conditional uncertainty checks
on:
  pull_request:
    paths:
      - 'core/irt_binary_persons.py'
      - 'core/irt_python_mirt_report.py'
      - 'ui/irt_python_library_view.py'
      - 'reports/irt_binary_report.py'
      - 'tests/test_binary34_uncertainty_contract.py'
      - 'tests/test_python_mirt_nine_results.py'
      - 'validation/binary_certification/AMENDMENT_E.json'
      - '.github/workflows/binary34-uncertainty.yml'
jobs:
  conditional-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Reuse project dependencies
        run: pip install -r requirements.txt
      - name: Targeted numerical and export checks only
        run: |
          python -m compileall -q core/irt_binary_persons.py core/irt_python_mirt_report.py ui/irt_python_library_view.py reports/irt_binary_report.py app.py
          python -m pytest -q -s 'tests/test_python_mirt_nine_results.py::test_actual_streamlit_tables_plots_downloads_and_invalidation[3PL]' 'tests/test_python_mirt_nine_results.py::test_actual_streamlit_tables_plots_downloads_and_invalidation[4PL]' --basetemp=/tmp/binary34-uncertainty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary34-conditional-moments
          path: /tmp/binary34-uncertainty/
