name: Missing data and IRT three-way scientific gates
on:
  pull_request:
    paths:
      - 'core/missing_*.py'
      - 'core/irt_missing_*.py'
      - 'pages/90_Kayip_Veri_Analizi_ve_Atama.py'
      - 'tests/test_missing_*.py'
      - 'tests/test_irt_missing_*.py'
      - '.github/workflows/missing-irt-validation.yml'
  workflow_dispatch:
jobs:
  scientific-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas scipy scikit-learn pytest mirt==1.2.0
      - name: Execute every missing-data and IRT numerical gate
        run: python -m pytest -q tests/test_missing_imputation.py tests/test_missing_decision.py tests/test_irt_missing_likelihood.py tests/test_irt_missing_em.py tests/test_irt_missing_three_way.py tests/test_irt_engine_policy.py tests/test_irt_binary_navigation.py tests/test_irt_library_model_smoke.py tests/test_irt_library_curves.py tests/test_irt_library_parameter_mapping.py
