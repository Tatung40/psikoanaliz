name: Missing data and IRT three-way scientific gates
on:
  pull_request:
    paths:
      - 'core/missing_*.py'
      - 'core/irt_missing_*.py'
      - 'core/irt_python_mirt_adapter.py'
      - 'core/irt_python_mirt_parameters.py'
      - 'tests/test_irt_python_mirt_parameters.py'
      - 'tests/test_irt_library_only_controls.py'
      - 'app.py'
      - 'tests/test_irt_streamlit_smoke.py'
      - 'tests/test_irt_binary_apptest.py'
      - 'core/irt_library_*.py'
      - 'validation/inspect_python_mirt_api.py'
      - 'validation/python_mirt_parameter_recovery.py'
      - 'validation/known_truth_irt_recovery.py'
      - 'tests/test_known_truth_irt_recovery.py'
      - 'validation/audit_legacy_irt_imports.py'
      - 'tests/test_irt_library_*.py'
      - 'tests/test_irt_python_mirt_adapter.py'
      - 'pages/90_Kayip_Veri_Analizi_ve_Atama.py'
      - 'tests/test_missing_*.py'
      - 'tests/test_irt_missing_*.py'
      - '.github/workflows/missing-irt-validation.yml'
  workflow_dispatch:
jobs:
  scientific-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute every missing-data and IRT numerical gate
        run: python -m pytest -q tests/test_missing_imputation.py tests/test_missing_decision.py tests/test_irt_missing_likelihood.py tests/test_irt_missing_em.py tests/test_irt_missing_three_way.py tests/test_irt_engine_policy.py tests/test_irt_binary_navigation.py tests/test_irt_library_model_smoke.py tests/test_irt_library_curves.py tests/test_irt_library_parameter_mapping.py tests/test_irt_library_diagnostics.py tests/test_irt_python_mirt_parameters.py tests/test_irt_library_only_controls.py tests/test_irt_python_mirt_adapter.py
      - name: Compile Streamlit app and verify static UI contracts
        run: python -m py_compile app.py core/irt_python_mirt_parameters.py && python -m pytest -q tests/test_irt_streamlit_smoke.py tests/test_irt_binary_apptest.py
      - name: Audit retired IRT import dependencies
        run: python validation/audit_legacy_irt_imports.py > legacy_irt_import_inventory.json
      - name: Upload legacy IRT import inventory
        uses: actions/upload-artifact@v4
        with:
          name: legacy-irt-import-inventory
          path: legacy_irt_import_inventory.json
      - name: Verify known-truth simulation generator
        run: python -m pytest -q tests/test_known_truth_irt_recovery.py
      - name: Run independent known-truth parameter recovery
        run: PYTHONPATH=. python validation/known_truth_irt_recovery.py > python_mirt_known_truth_recovery.json
      - name: Run 3PL and 4PL sample-size sensitivity
        run: PYTHONPATH=. python -c 'import json; from validation.known_truth_irt_recovery import sensitivity_run; print(json.dumps(sensitivity_run(), indent=2, allow_nan=False))' > python_mirt_34pl_sensitivity.json
      - name: Validate sensitivity experiment integrity
        run: |
          python - <<'PY'
          import json
          report = json.load(open('python_mirt_34pl_sensitivity.json'))
          assert len(report['runs']) == 12, 'Incomplete sensitivity design'
          groups = report['summary_by_sample_size']
          assert len(groups) == 6, 'Missing model/sample-size groups'
          assert all(g['attempted'] == 2 for g in groups.values())
          print('Sensitivity experiment design verified; recovery errors remain empirical.')
          PY
      - name: Upload 3PL and 4PL sensitivity report
        uses: actions/upload-artifact@v4
        with:
          name: python-mirt-34pl-sensitivity
          path: python_mirt_34pl_sensitivity.json
      - name: Upload known-truth recovery report
        uses: actions/upload-artifact@v4
        with:
          name: python-mirt-known-truth-recovery
          path: python_mirt_known_truth_recovery.json
      - name: Inspect real Python mirt fit-object structure
        run: python validation/inspect_python_mirt_api.py > python_mirt_api_report.json
      - name: Generate fixed-seed Python mirt simulation stability report
        run: PYTHONPATH=. python validation/python_mirt_parameter_recovery.py > python_mirt_simulation_stability.json
      - name: Upload simulation stability report
        uses: actions/upload-artifact@v4
        with:
          name: python-mirt-simulation-stability
          path: python_mirt_simulation_stability.json
      - name: Upload API structure report
        uses: actions/upload-artifact@v4
        with:
          name: python-mirt-fit-api
          path: python_mirt_api_report.json
