name: Independent R mirt — 3PL/4PL ML with SE, RSM
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/r_mirt_34/**'
      - 'validation/irt_3pl4pl_root_cause.py'
      - 'validation/r_mirt_rsm/**'
      - 'core/irt_rsm.py'
      - 'core/irt_python_mirt_adapter.py'
      - 'core/irt_binary_inference.py'
      - 'tests/test_r_mirt_34.py'
      - '.github/workflows/r-mirt-34.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt@1.48
            any::jsonlite
          cache-version: 1
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python-side formulas
        run: python -m pytest -q tests/test_r_mirt_34.py
      - name: Actual R mirt fits and preregistered comparison (validation/mirt_stage1/criteria.json)
        run: python validation/r_mirt_34/compare.py --output validation-output/r-mirt-34
      - name: Actual R mirt RSM fits and preregistered comparison
        if: always()
        run: python validation/r_mirt_rsm/compare.py --output validation-output/r-mirt-rsm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-mirt-34-${{ github.sha }}
          path: validation-output/
          if-no-files-found: error
