name: MIRT Stage 1 independent R comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'core/irt_multidim.py'
      - 'ui/irt_multidim_view.py'
      - 'reports/irt_multidim_report.py'
      - 'tests/test_mirt_stage1.py'
      - 'tests/test_mirt_multidim_ui.py'
      - 'tests/test_mirt_phase2_capabilities.py'
      - 'tests/test_mirt_factorized.py'
      - 'validation/mirt_phase2/**'
      - 'validation/mirt_phase3/**'
      - 'tests/test_mirt_phase3.py'
      - 'core/irt_multidim_factorized.py'
      - 'core/irt_multidim_rsm_stack.py'
      - 'tests/test_mirt_rsm_stack.py'
      - 'validation/r_mirt_phase1/matched_ml.R'
      - 'validation/mirt_stage1/**'
      - '.github/workflows/mirt-stage1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt@1.48
            any::nloptr
            any::jsonlite
          cache-version: 2
      - name: Python dependencies (existing environment specification)
        run: python -m pip install -r requirements.txt 'mirt==1.2.0'
      - name: Focused API, mathematical and actual Streamlit checks
        run: python -m pytest -q tests/test_mirt_stage1.py tests/test_mirt_multidim_ui.py tests/test_mirt_phase2_capabilities.py tests/test_mirt_factorized.py tests/test_mirt_rsm_stack.py tests/test_mirt_phase3.py
      - name: Phase 2 capability audit (no fits)
        run: python validation/mirt_phase2/capability_audit.py --output validation-output/mirt-phase2/capability_audit.json
      - name: Reuse retained converged fits (no recalibration)
        uses: actions/download-artifact@v4
        with:
          name: mirt-stage1-c8e9448532b373ba8484be815ffc1d9a75054de4-40490151345
          run-id: 40490151345
          github-token: ${{ github.token }}
          path: original-evidence
      - name: Verify all 12 retained profiles at fixed parameters (no recalibration)
        run: python validation/mirt_stage1/compare.py --output validation-output/mirt-stage1 --reuse original-evidence/mirt-stage1 --expand
      - name: Opt-in independent Phase 2 calibration (no automatic retries)
        run: python validation/mirt_phase2/factorized_comparison.py --output validation-output/mirt-phase2-fit
      - name: Phase 3 opt-in independent general-CFA comparison
        run: python validation/mirt_phase3/compare.py --output validation-output/mirt-phase3
      - name: Compact diagnostics even after failure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          for path in pathlib.Path('validation-output/mirt-stage1').glob('*/report.json'):
              print('MIRT_REPORT='+json.dumps(json.loads(path.read_text()),ensure_ascii=False))
          PY
          find validation-output -name stderr.log -exec sh -c 'echo "$1"; tail -n 16 "$1"' sh {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirt-stage1-${{ github.sha }}-${{ github.run_id }}
          path: validation-output/
          if-no-files-found: error
          retention-days: 30
