name: MIRT Stage 1 independent R comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'core/irt_mirt_*.py'
      - 'tests/test_mirt_core_*.py'
      - 'validation/mirt_core_production/**'
      - 'core/irt_multidim.py'
      - 'ui/irt_multidim_view.py'
      - 'reports/irt_multidim_report.py'
      - 'tests/test_mirt_stage1.py'
      - 'tests/test_mirt_multidim_ui.py'
      - 'tests/test_mirt_phase2_capabilities.py'
      - 'tests/test_mirt_factorized.py'
      - 'validation/mirt_phase2/**'
      - 'validation/mirt_phase3/**'
      - 'tests/test_mirt_phase3.py'
      - 'tests/test_mirt_general_ui.py'
      - 'tests/test_mirt_phase3_eligibility.py'
      - 'core/irt_multidim_general.py'
      - 'core/irt_multidim_general_report.py'
      - 'core/irt_multidim_factorized.py'
      - 'core/irt_multidim_rsm_stack.py'
      - 'tests/test_mirt_rsm_stack.py'
      - 'validation/r_mirt_phase1/matched_ml.R'
      - 'validation/mirt_stage1/**'
      - '.github/workflows/mirt-stage1.yml'
  workflow_dispatch:
    inputs:
      run_advanced_calibrations:
        description: 'Explicit separate advanced-model campaigns; not part of core PR audit'
        type: boolean
        default: false
      reevaluate_archived_artifact:
        description: 'Reevaluate original raw saved-fit artifact if still available; no refit fallback'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt@1.48
            any::nloptr
            any::jsonlite
          cache-version: 2
      - name: Python dependencies (existing environment specification)
        run: python -m pip install -r requirements.txt 'mirt==1.2.0'
      - name: Compile changed MIRT production sources before any numerical work
        run: python -m compileall -q core/irt_mirt_policy.py core/irt_mirt_diagnostics.py core/irt_mirt_production.py ui/irt_multidim_view.py reports/irt_multidim_report.py validation/mirt_core_production tests/test_mirt_core_policy.py tests/test_mirt_core_production.py
      - name: Reproduce exact structural-zero refusal regression first (no fitting)
        run: python -m pytest -q 'tests/test_mirt_core_policy.py::test_observable_mismatches_invalid_results_and_bounds_fail_closed[structural_zero]'
      - name: Frozen core-source and retained independent evidence audit (ZERO calibration)
        run: python -m validation.mirt_core_production.audit --output validation-output/mirt-core/audit.json
      - name: Targeted core numerical identities, scoped status, real UI and exports
        run: python -m pytest -q -rP tests/test_mirt_core_policy.py tests/test_mirt_core_diagnostics.py tests/test_mirt_core_exports.py tests/test_mirt_core_integrity.py tests/test_mirt_core_word_cache.py tests/test_mirt_core_archive.py
      - name: Verify permanently archived canonical C1 raw evidence (ZERO fits; no expiring artifact dependency)
        run: python -m validation.mirt_core_production.archive
      - name: Actual native software fixtures, UI, Word and content-bound export cache
        run: python -m pytest -q -rP tests/test_mirt_core_production.py
      - name: Installed independent R reference version (no calibration)
        run: Rscript -e 'stopifnot(as.character(packageVersion("mirt"))=="1.48"); sessionInfo()'
      - name: Focused API, mathematical and actual Streamlit checks
        run: python -m pytest -q tests/test_mirt_stage1.py tests/test_mirt_multidim_ui.py tests/test_mirt_phase2_capabilities.py tests/test_mirt_factorized.py tests/test_mirt_rsm_stack.py tests/test_mirt_phase3.py tests/test_mirt_general_ui.py tests/test_mirt_phase3_eligibility.py
      - name: Phase 2 capability audit (no fits)
        run: python validation/mirt_phase2/capability_audit.py --output validation-output/mirt-phase2/capability_audit.json
      - name: Reuse retained converged fits (no recalibration; optional raw artifact may be expired)
        if: github.event_name == 'workflow_dispatch' && inputs.reevaluate_archived_artifact
        uses: actions/download-artifact@v4
        with:
          name: mirt-stage1-452db8fc6dde0028964c998064020f6713d20c24-40499970808
          run-id: 40499970808
          github-token: ${{ github.token }}
          path: original-evidence
      - name: Verify all 12 retained profiles at fixed parameters (no recalibration)
        if: github.event_name == 'workflow_dispatch' && inputs.reevaluate_archived_artifact
        run: python validation/mirt_stage1/compare.py --output validation-output/mirt-stage1 --reuse original-evidence/mirt-stage1 --expand
      - name: Opt-in independent Phase 2 calibration (no automatic retries)
        if: github.event_name == 'workflow_dispatch' && inputs.run_advanced_calibrations
        run: python validation/mirt_phase2/factorized_comparison.py --output validation-output/mirt-phase2-fit
      - name: Phase 3 actual R API contract (no IRT fits)
        run: Rscript validation/mirt_phase3/runtime_contract.R validation-output/mirt-phase3-runtime
      - name: Phase 3 opt-in independent general-CFA comparison
        if: github.event_name == 'workflow_dispatch' && inputs.run_advanced_calibrations
        run: python validation/mirt_phase3/compare.py --output validation-output/mirt-phase3
      - name: Compact diagnostics even after failure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          for path in pathlib.Path('validation-output/mirt-stage1').glob('*/report.json'):
              print('MIRT_REPORT='+json.dumps(json.loads(path.read_text()),ensure_ascii=False))
          PY
          find validation-output -name stderr.log -exec sh -c 'echo "$1"; tail -n 16 "$1"' sh {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirt-stage1-${{ github.sha }}-${{ github.run_id }}
          path: validation-output/
          if-no-files-found: error
          retention-days: 30
