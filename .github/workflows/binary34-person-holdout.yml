name: 3PL 4PL independent person holdout pilot
on:
  pull_request:
    paths:
      - 'validation/uncertainty_f/**'
      - 'tests/test_binary34_person_holdout.py'
      - '.github/workflows/binary34-person-holdout.yml'
permissions:
  contents: read
jobs:
  person-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        model: ['3PL', '4PL']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Reuse existing project dependencies
        run: pip install -r requirements.txt
      - name: Lightweight affected tests only
        run: python -m pytest -q tests/test_binary34_person_holdout.py
      - name: Exactly one preregistered fit and independent holdout
        run: |
          mkdir -p /tmp/person-holdout
          set -o pipefail
          if [ -f 'validation/evidence/binary34_person_holdout_f/${{ matrix.model }}.json' ]; then
            # Archiving results must not launch the same calibration again.
            python -m pytest -q tests/test_binary34_holdout_evidence.py
            git fetch --no-tags --depth=1 origin 8059811660688008ce483908c67baefad48dd5e1
            for source in validation/uncertainty_f/runner.py validation/uncertainty_f/PROTOCOL.json core/irt_binary_persons.py core/irt_python_mirt_adapter.py core/irt_binary_inference.py validation/binary_certification/common.py validation/irt_3pl4pl_root_cause.py; do
              git show '8059811660688008ce483908c67baefad48dd5e1':"$source" | cmp - "$source"
            done
            echo 'REUSED original run 45593803451: exact scientific sources verified; no new fit.'
          else
            python -u validation/uncertainty_f/runner.py --model '${{ matrix.model }}' --output /tmp/person-holdout 2>&1 | tee /tmp/person-holdout/execution.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: person-holdout-${{ matrix.model }}
          path: /tmp/person-holdout/
