name: P3 empirical covariance and standardized residual validation
on:
  pull_request:
    paths: ['validation/p3_empirical/**','validation/evidence/p3_empirical/**','tests/test_p3_empirical.py','tests/test_p3_constrained.py','tests/test_p3_absorption.py','tests/test_p3_production.py','core/irt_sx2_scoped.py','.github/workflows/p3-empirical.yml']
permissions:
  contents: read
  actions: read
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Native production, scope/refusal, cache, Word/CSV/XLSX/ZIP, portable sources and preserved gates
        run: python -m pytest -q tests/test_p3_production.py tests/test_p3_absorption.py tests/test_universal_academic_capture.py::test_graphic_selection_updates_word_without_refitting tests/test_binary34_uncertainty_contract.py tests/test_reproducible.py::test_inventory_is_current_and_includes_missing_data_page
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Frozen committed evidence audit; zero downloads, fits or simulated data
        run: python -m validation.p3_empirical.frozen_audit
  absorption:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Stable log-probability quadrature and explicit feasible 4PL null; no refits
        run: python -m validation.p3_empirical.absorption --out /tmp/p3-proof/REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3-absorption-proof, path: /tmp/p3-proof/}
