name: P3 empirical covariance and standardized residual validation
on:
  pull_request:
    paths: ['validation/p3_empirical/**','validation/evidence/p3_empirical/**','tests/test_p3_empirical.py','tests/test_p3_constrained.py','tests/test_p3_absorption.py','tests/test_p3_production.py','core/irt_sx2_scoped.py','.github/workflows/p3-empirical.yml']
permissions:
  contents: read
  actions: read
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: New analytic absorption proof; no calibration
        run: python -m pytest -q tests/test_p3_absorption.py
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: p3-confirm-*, path: /tmp/p3-input, merge-multiple: true, run-id: 45808993982, github-token: '${{ github.token }}'}
      - name: Independent arithmetic and seed/provenance audit; NO fits or simulated data
        run: |
          mkdir -p /tmp/p3-audit
          python -m validation.p3_empirical.audit --input /tmp/p3-input --report /tmp/p3-input/REPORT.json --out /tmp/p3-audit/AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3-independent-audit, path: /tmp/p3-audit/}
  absorption:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Stable log-probability quadrature and explicit feasible 4PL null; no refits
        run: python -m validation.p3_empirical.absorption --out /tmp/p3-proof/REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3-absorption-proof, path: /tmp/p3-proof/}
