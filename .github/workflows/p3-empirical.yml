name: P3 empirical covariance and standardized residual validation
on:
  pull_request:
    paths: ['validation/p3_empirical/**','tests/test_p3_empirical.py','.github/workflows/p3-empirical.yml']
permissions:
  contents: read
  actions: read
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Targeted read-only aggregation regression
        run: python -m pytest -q tests/test_p3_constrained.py tests/test_p3_empirical.py::test_aggregate_cli_serializes_numpy_gate_booleans
      - id: plan
        run: echo "phase=$(python -c 'import json;print(json.load(open("validation/p3_empirical/RUN.json"))["phase"])')" >> "$GITHUB_OUTPUT"
      - name: Exact native package and runtime source provenance
        run: |
          mkdir -p /tmp/p3-runtime
          pip freeze > /tmp/p3-runtime/packages.txt
          python - <<'PY'
          import inspect,json,mirt
          import mirt.models.dichotomous as d
          from pathlib import Path
          source=inspect.getsource(d)
          Path("/tmp/p3-runtime/native_dichotomous.py").write_text(source)
          print("MIRT_VERSION",mirt.__version__)
          hits={}
          for p in Path(mirt.__file__).parent.rglob("*.py"):
              ss=p.read_text()
              if "bounds" not in ss:continue
              lines=ss.splitlines(); excerpts=[]
              for i,line in enumerate(lines):
                  if "bounds" in line.lower() and any(k in ss for k in ("guessing","difficulty","discrimination")):
                      excerpts.append("\n".join(lines[max(0,i-1):i+8]))
              if excerpts:hits[str(p.relative_to(Path(mirt.__file__).parent))]=excerpts[:10]
          Path("/tmp/p3-runtime/bounds.json").write_text(json.dumps(hits))
          print("RUNTIME_BOUND_SOURCES",json.dumps(hits))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3-runtime, path: /tmp/p3-runtime/}
  pilot:
    needs: mathematics
    if: needs.mathematics.outputs.phase == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: ['3PL','4PL']
        shard: [0,1]
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: 'p3-m1-${{ matrix.model }}-*'
          path: /tmp/p3-input
          merge-multiple: true
          run-id: 45806031473
          github-token: '${{ github.token }}'
      - name: New constrained and efficient diagnostics on frozen native calibrations; zero refits
        run: python -m validation.p3_empirical.replay --model '${{ matrix.model }}' --input /tmp/p3-input --out /tmp/p3-data --shard '${{ matrix.shard }}' --shards 2
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p3-m2-${{ matrix.model }}-${{ matrix.shard }}', path: /tmp/p3-data/}
  aggregate:
    needs: [mathematics,pilot]
    if: always() && needs.mathematics.result == 'success' && needs.mathematics.outputs.phase == 'replay' && needs.pilot.result == 'success'
    runs-on: ubuntu-latest
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: p3-m2-*, path: /tmp/p3-input, merge-multiple: true}
      - run: python -m validation.p3_empirical.aggregate --input /tmp/p3-input --phase pilot --methods p_constrained,p_constrained_standardized,p_efficient --out /tmp/p3-output/REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3-m2-summary, path: /tmp/p3-output/}

  population:
    needs: mathematics
    if: needs.mathematics.outputs.phase == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: ., OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: p3-m1-*, path: /tmp/p3-input, merge-multiple: true, run-id: 45806031473, github-token: '${{ github.token }}'}
      - name: Deterministic population MAP and alternative-absorption diagnosis; no generated data
        run: python -m validation.p3_empirical.population --input /tmp/p3-input --out /tmp/p3-population/REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p3-population, path: /tmp/p3-population/}
