name: IRT benchmark (opt-in)

on:
  workflow_dispatch:
    inputs:
      sample_sizes:
        description: 'Comma-separated sample sizes'
        required: true
        default: '200,500,1000,2000'
      repetitions:
        description: 'Simulation repetitions'
        required: true
        default: '10'
      max_iter:
        description: 'EM iteration cap'
        required: true
        default: '70'
  push:
    paths:
      - 'scripts/irt_benchmark.py'
      - '.github/workflows/irt-benchmark.yml'

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        generating_model: ['3PL', '4PL']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install scientific dependencies
        run: python -m pip install numpy pandas scipy xlsxwriter openpyxl
      - name: Run bounded parameter recovery benchmark
        env:
          SAMPLE_SIZES: ${{ inputs.sample_sizes || '200,500,1000,2000' }}
          REPETITIONS: ${{ inputs.repetitions || '10' }}
          MAX_ITER: ${{ inputs.max_iter || '70' }}
        run: |
          python scripts/irt_benchmark.py \
            --sample-sizes "$SAMPLE_SIZES" \
            --repetitions "$REPETITIONS" \
            --max-iter "$MAX_ITER" \
            --generating-model "${{ matrix.generating_model }}" \
            --items 25 --points 21 \
            --output-dir artifacts/irt-benchmark
      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irt-benchmark-${{ matrix.generating_model }}
          path: artifacts/irt-benchmark/
          if-no-files-found: warn
          retention-days: 14
